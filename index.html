<!doctype html>

<html lang="vi">

  <head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>SMS Number Manager</title>

    <style>

      * {

        box-sizing: border-box;

      }

      body {

        margin: 0;

        padding: 40px;

        font-family: Inter, Arial, sans-serif;

        background: #f5f7fb;

        color: #1f2937;

      }

      .container {

        max-width: 1450px;

        margin: auto;

      }

      .card {

        background: white;

        border-radius: 14px;

        padding: 24px;

        box-shadow: 0 5px 25px rgba(0, 0, 0, 0.06);

      }

      h2 {

        margin-top: 0;

      }

      .token-row {

        display: flex;

        justify-content: flex-end;

        gap: 10px;

        margin-bottom: 18px;

      }

      .controls {

        display: flex;

        flex-wrap: wrap;

        align-items: end;

        gap: 12px;

        margin-bottom: 24px;

      }

      .controls .field {

        width: 170px;

      }

      .field label {

        display: block;

        font-size: 13px;

        margin-bottom: 6px;

        color: #6b7280;

      }

      input,

      select {

        width: 100%;

        height: 42px;

        border: 1px solid #d1d5db;

        border-radius: 8px;

        padding: 0 12px;

        outline: none;

        background: white;

      }

      input:focus,

      select:focus {

        border-color: #2563eb;

        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);

      }

      .antd-select {

        position: relative;

        width: 100%;

      }

      .antd-select input {

        padding: 0 58px 0 12px;

        cursor: pointer;

        transition:

          border-color 0.2s,

          box-shadow 0.2s;

      }

      .antd-select.open input,

      .antd-select input:focus {

        cursor: text;

        border-color: #1677ff;

        box-shadow: 0 0 0 2px rgba(5, 145, 255, 0.1);

      }

      .antd-select.disabled {

        opacity: 0.55;

      }

      .select-arrow {

        position: absolute;

        right: 13px;

        top: 17px;

        width: 7px;

        height: 7px;

        border-right: 1.5px solid #8c8c8c;

        border-bottom: 1.5px solid #8c8c8c;

        transform: rotate(45deg);

        pointer-events: none;

        transition: transform 0.2s;

      }

      .antd-select.open .select-arrow {

        top: 20px;

        transform: rotate(225deg);

      }

      .select-clear {

        display: none;

        position: absolute;

        right: 30px;

        top: 12px;

        width: 18px;

        height: 18px;

        padding: 0;

        border-radius: 50%;

        background: #bfbfbf;

        color: white;

        font-size: 14px;

        line-height: 17px;

        font-weight: 400;

        z-index: 2;

      }

      .antd-select.has-value:hover .select-clear {

        display: block;

      }

      .select-dropdown {

        display: none;

        position: absolute;

        z-index: 1000;

        top: calc(100% + 4px);

        left: 0;

        width: 100%;

        max-height: 280px;

        overflow-y: auto;

        padding: 4px;

        background: white;

        border-radius: 8px;

        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);

      }

      .antd-select.open .select-dropdown {

        display: block;

      }

      .product-field .select-dropdown {

        min-width: 480px;

      }

      .select-option {

        padding: 8px 12px;

        border-radius: 4px;

        cursor: pointer;

        font-size: 14px;

        line-height: 22px;

        white-space: nowrap;

        overflow: hidden;

        text-overflow: ellipsis;

      }

      .select-option:hover,

      .select-option.active {

        background: #f5f5f5;

      }

      .select-option.selected {

        background: #e6f4ff;

        font-weight: 600;

      }

      .select-option mark {

        padding: 0;

        background: transparent;

        color: #1677ff;

        font-weight: 600;

      }

      .select-empty {

        padding: 14px 12px;

        color: #8c8c8c;

        text-align: center;

        font-size: 14px;

      }

      button {

        height: 42px;

        border: 0;

        border-radius: 8px;

        padding: 0 20px;

        cursor: pointer;

        font-weight: 600;

      }

      button:disabled {

        cursor: not-allowed;

        opacity: 0.55;

      }

      .primary-btn {

        align-self: end;

        background: #2563eb;

        color: white;

      }

      .primary-btn:hover:not(:disabled) {

        background: #1d4ed8;

      }

      .secondary-btn {

        align-self: end;

        background: #e5e7eb;

        color: #111827;

      }

      .danger-btn {

        background: #fff1f0;

        color: #cf1322;

        border: 1px solid #ffa39e;

      }

      .danger-btn:hover:not(:disabled) {

        background: #ffccc7;

      }

      .row-delete {

        height: 30px;

        padding: 0 12px;

        background: transparent;

        color: #cf1322;

        border: 1px solid #ffccc7;

      }

      .row-delete:hover {

        background: #fff1f0;

        border-color: #ff7875;

      }

      .hint {

        margin: -8px 0 20px;

        color: #6b7280;

        font-size: 12px;

      }

      .table-wrap {

        overflow-x: auto;

        max-width: 100%;

      }

      table {

        width: 100%;

        border-collapse: collapse;

      }

      th {

        text-align: left;

        background: #f9fafb;

        padding: 13px;

        font-size: 13px;

        color: #6b7280;

      }

      td {

        padding: 14px 13px;

        border-top: 1px solid #eee;

        white-space: nowrap;

      }

      .copy {

        cursor: pointer;

        font-family: monospace;

        font-size: 14px;

      }

      .copy:hover {

        color: #2563eb;

        text-decoration: underline;

      }

      .status {

        padding: 5px 10px;

        border-radius: 20px;

        font-size: 12px;

        display: inline-block;

      }

      .waiting {

        background: #fef3c7;

        color: #92400e;

      }

      .success {

        background: #dcfce7;

        color: #166534;

      }

      .failed {

        background: #fee2e2;

        color: #991b1b;

      }

      .toast {

        position: fixed;

        right: 25px;

        bottom: 25px;

        max-width: 420px;

        background: #111827;

        color: white;

        padding: 12px 18px;

        border-radius: 8px;

        opacity: 0;

        transform: translateY(10px);

        transition: 0.2s;

        pointer-events: none;

      }

      .toast.show {

        opacity: 1;

        transform: translateY(0);

      }

      .product-options {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        width: 100%;
        margin-bottom: 12px;
      }

      .product-option {
        flex: 1;
        min-width: 220px;
        padding: 12px 16px;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        background: white;
        cursor: pointer;
        transition: 0.2s;
      }

      .product-option:hover {
        border-color: #2563eb;
      }

      .product-option.selected {
        border-color: #2563eb;
        background: #eff6ff;
        box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.12);
      }

      .product-option .product-name {
        font-weight: 600;
        margin-bottom: 5px;
      }

      .product-option .product-info {
        font-size: 12px;
        color: #6b7280;
      }

      .product-option .product-price {
        color: #00a99d;
        font-weight: 700;
        margin-left: 5px;
      }



      .country-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        max-height: 190px;
        overflow-y: auto;
        padding: 8px;
        margin-top: 8px;
        border: 1px solid #293244;
        border-radius: 10px;
        background: #0b1220;
      }
      .country-chip {
        min-height: 34px;
        height: auto;
        padding: 7px 12px;
        border: 1px solid #263244;
        border-radius: 9px;
        background: #101827;
        color: #aab7cf;
        font-size: 12px;
        font-weight: 500;
        white-space: nowrap;
      }
      .country-chip:hover,
      .country-chip.selected {
        color: #fff;
        border-color: #3978ed;
        background: #172c50;
      }
      .country-loading {
        color: #9ca3af;
        font-size: 13px;
        padding: 8px;
      }
      @media (max-width: 600px) {

        body {

          padding: 12px;

        }

        .card {

          padding: 16px;

        }

        h2 {

          font-size: 20px;

        }

        .controls {

          display: grid;

          grid-template-columns: minmax(0, 1fr);

          gap: 10px;

        }

        .controls .field,

        .controls button,

        .token-row button {

          width: 100%;

        }

        .token-row {

          justify-content: stretch;

        }

        .table-wrap {

          overflow: visible;

        }

        table,

        tbody,

        tr,

        td {

          display: block;

          width: 100%;

        }

        thead {

          display: none;

        }

        tr {

          margin-bottom: 12px;

          padding: 8px 12px;

          border: 1px solid #e5e7eb;

          border-radius: 10px;

          overflow: hidden;

        }

        td {

          display: flex;

          align-items: flex-start;

          justify-content: space-between;

          gap: 12px;

          padding: 10px 0;

          white-space: normal;

          overflow-wrap: anywhere;

        }

        td:first-child {

          border-top: 0;

        }

        td::before {

          flex: 0 0 38%;

          color: #6b7280;

          font-size: 12px;

          font-weight: 600;

        }

        td:nth-child(1)::before { content: 'Mã đơn'; }

        td:nth-child(2)::before { content: 'Số điện thoại'; }

        td:nth-child(3)::before { content: 'OTP'; }

        td:nth-child(4)::before { content: 'Trạng thái'; }

        td:nth-child(5)::before { content: 'Thời gian mua'; }

        td:nth-child(6)::before { content: 'Thao tác'; }

        .toast {

          left: 12px;

          right: 12px;

          bottom: 12px;

          max-width: none;

        }

      }

    </style>

  </head>

  <body>

    <div class="container">

      <div class="card">

        <h2>SMS Number Manager</h2>

        <div id="roomStatus" style="font-size:12px;color:#6b7280;margin-bottom:12px">Thiết bị đang kết nối: 0</div>

        <div class="token-row">

          <button id="copyAllOtp" class="secondary-btn" type="button" disabled>Copy OTP</button>

        </div>

        <div class="controls">

          <div class="field">
            <label for="providerSelect">Nhà cung cấp</label>
            <select id="providerSelect">
              <option value="smscode">SMSCode</option>
              <option value="grizzly">GrizzlySMS</option>
            </select>
          </div>
          <div class="field" id="countryField" style="width:100%;flex-basis:100%">
            <label for="countrySearch">Chọn quốc gia SMSCode</label>
            <input id="countrySearch" type="search" placeholder="Tìm quốc gia..." autocomplete="off" />
            <div id="countryGrid" class="country-grid">
              <span class="country-loading">Đang tải danh sách quốc gia...</span>
            </div>
          </div>
          <div class="field" id="balanceField" style="width:190px">
            <label>Số dư</label>
            <div id="providerBalance" style="height:42px;display:flex;align-items:center;padding:0 12px;border:1px solid #d1d5db;border-radius:8px;background:#f9fafb">—</div>
          </div>
          <div class="field">

            <label for="interval">Kiểm tra OTP (giây)</label>

            <input id="interval" type="number" value="5" min="1" />

          </div>

          <div class="product-options" id="productOptions"><div class="product-option">Đang tải sản phẩm...</div></div>
<button id="localBuyButton" class="secondary-btn" type="button">Lấy số riêng thiết bị này</button>

        </div>

        <div class="table-wrap">

          <table>

            <thead>

              <tr>

                <th>Mã đơn</th>

                <th>Số điện thoại</th>

                <th>OTP</th>

                <th>Trạng thái</th>

                <th>Thời gian mua</th>

                <th>Thao tác</th>

              </tr>

            </thead>

            <tbody id="list"></tbody>

          </table>

        </div>

      </div>

    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="/socket.io/socket.io.js"></script>

    <script src="./smscode.js"></script>

    <script src="./order-time.js"></script>

    <script src="./polling-registry.js"></script>

    <script>

      const elements = {

        copyAllOtp: document.getElementById('copyAllOtp'),

        interval: document.getElementById('interval'),
        providerSelect: document.getElementById('providerSelect'),
        countrySearch: document.getElementById('countrySearch'),
        countryGrid: document.getElementById('countryGrid'),
        countryField: document.getElementById('countryField'),
        providerBalance: document.getElementById('providerBalance'),


        localBuyButton: document.getElementById('localBuyButton'),

        list: document.getElementById('list'),

        toast: document.getElementById('toast'),

      }



      const ROOM_ID = 'room-main'

      let PRODUCT_ID = null

      const deviceId = getDeviceId()

      const processedCommands = new Set()

      const socket = io()

      let onlineCount = 0

      let buying = false

      let purchaseQueue = Promise.resolve()

      let client = SmscodeApi.createSmscodeClient()
      // Trạng thái nhà cung cấp và thông tin từng đơn hàng
      let activeProvider = 'smscode'
      let selectedCallingCode = '1'
      let availableCountries = []
      let selectedCountry = null
      let selectedGrizzlyMaxPrice = 0.015
      const orderProviders = new Map()
      let applyingRemoteSettings = false
      let currentSharedRevision = 0

      const productOptions = document.getElementById('productOptions')

      loadProviderProducts()
      elements.providerSelect.addEventListener('change', async () => {
        activeProvider = elements.providerSelect.value
        PRODUCT_ID = null
        elements.countryField.style.display = activeProvider === 'smscode' ? '' : 'none'
        await loadProviderProducts()
        updateBuyButton()
        broadcastSharedSettings()
      })

      elements.countrySearch.addEventListener('input', renderCountryChips)

      function asArray(value) {
        if (Array.isArray(value)) return value
        if (Array.isArray(value?.data)) return value.data
        if (Array.isArray(value?.items)) return value.items
        if (Array.isArray(value?.results)) return value.results
        if (Array.isArray(value?.countries)) return value.countries
        if (Array.isArray(value?.services)) return value.services
        if (Array.isArray(value?.products)) return value.products
        return []
      }

      function textOf(item, keys) {
        for (const key of keys) {
          const value = item?.[key]
          if (value != null && String(value).trim()) return String(value).trim()
        }
        return ''
      }

      function callingCodeOf(country) {
        let code = textOf(country, ['calling_code', 'phone_code', 'dial_code', 'callingCode', 'phoneCode', 'prefix', 'callingCode'])
        if (!code) {
          const iso = textOf(country, ['iso2', 'iso', 'code', 'country_code']).toUpperCase()
          const known = { US: '1', USA: '1', CO: '57', COL: '57', VN: '84', VNM: '84' }
          code = known[iso] || ''
        }
        return code.replace(/^\+/, '').replace(/\D/g, '')
      }

      function getPriceValue(product) {
        const price = product?.price
        if (price && typeof price === 'object') return Number(price.amount ?? price.value ?? 0)
        return Number(price ?? 0)
      }

      function formatProductPrice(product) {
        const price = product?.price
        if (price && typeof price === 'object' && price.currency) {
          return `${price.currency === 'USD' ? '$' : ''}${price.amount ?? price.value ?? '—'}${price.currency !== 'USD' ? ' ' + price.currency : ''}`
        }
        const value = getPriceValue(product)
        return Number.isFinite(value) && value > 0 ? `$${value.toFixed(4)}` : 'Giá xem trên SMSCode'
      }

      function chooseProduct(option, sync = true) {
        if (!option) return
        productOptions.querySelectorAll('.product-option').forEach(item => item.classList.remove('selected'))
        option.classList.add('selected')
        PRODUCT_ID = Number(option.dataset.productId)
        if (sync) broadcastSharedSettings()
      }

      let loadingProducts = false

      function countryIdOf(country) {
        return Number(country.id ?? country.country_id)
      }

      function countryNameOf(country) {
        return textOf(country, ['name', 'country_name', 'title']) || `Quốc gia ${countryIdOf(country)}`
      }

      function countryIsoOf(country) {
        return textOf(country, ['iso2', 'iso', 'code', 'country_code']).toUpperCase()
      }

      function renderCountryChips() {
        if (!elements.countryGrid) return
        const query = String(elements.countrySearch?.value || '').trim().toLowerCase()
        elements.countryGrid.replaceChildren()

        const filtered = availableCountries.filter(country => {
          const name = countryNameOf(country).toLowerCase()
          const iso = countryIsoOf(country).toLowerCase()
          const dial = callingCodeOf(country)
          return !query || name.includes(query) || iso.includes(query) || dial.includes(query)
        })

        if (!filtered.length) {
          const empty = document.createElement('span')
          empty.className = 'country-loading'
          empty.textContent = 'Không tìm thấy quốc gia.'
          elements.countryGrid.appendChild(empty)
          return
        }

        filtered.forEach(country => {
          const id = countryIdOf(country)
          const iso = countryIsoOf(country)
          const dial = callingCodeOf(country)
          const chip = document.createElement('button')
          chip.type = 'button'
          chip.className = 'country-chip' +
            (selectedCountry && countryIdOf(selectedCountry) === id ? ' selected' : '')
          chip.textContent = `${iso ? iso + ' ' : ''}${countryNameOf(country)}${dial ? ' +' + dial : ''}`
          chip.title = countryNameOf(country)
          chip.addEventListener('click', async () => {
            selectedCountry = country
            selectedCallingCode = dial
            renderCountryChips()
            PRODUCT_ID = null
            await loadTikTokProductsForSelectedCountry()
            updateBuyButton()
            broadcastSharedSettings()
          })
          elements.countryGrid.appendChild(chip)
        })
      }

      async function loadProviderProducts() {
        if (loadingProducts) return
        loadingProducts = true
        PRODUCT_ID = null
        productOptions.innerHTML = ''

        const showMessage = text => {
          productOptions.innerHTML = ''
          const message = document.createElement('div')
          message.className = 'product-option'
          message.textContent = text
          productOptions.appendChild(message)
          PRODUCT_ID = null
        }

        try {
          if (activeProvider === 'grizzly') {
            selectedCallingCode = '1'
            elements.countryField.style.display = 'none'
            const catalogResponse = await fetch('/api/grizzly/catalog')
            const catalogPayload = await catalogResponse.json()
            if (!catalogResponse.ok || !catalogPayload.success) throw new Error(catalogPayload.error?.message || 'Không tải được danh mục GrizzlySMS.')
            for (const priceCap of [0.015, 0.025]) {
              const option = document.createElement('div')
              option.className = 'product-option' + (priceCap === 0.015 ? ' selected' : '')
              option.dataset.maxPrice = String(priceCap)
              const name = document.createElement('div')
              name.className = 'product-name'
              name.textContent = `TikTok USA virtual · tối đa $${priceCap.toFixed(3)}`
              const info = document.createElement('div')
              info.className = 'product-info'
              info.textContent = 'GrizzlySMS · chỉ mua nếu giá thực tế không vượt mức đã chọn'
              option.append(name, info)
              option.addEventListener('click', () => {
                productOptions.querySelectorAll('.product-option').forEach(item => item.classList.remove('selected'))
                option.classList.add('selected')
                PRODUCT_ID = priceCap === 0.015 ? 15 : 25
                selectedGrizzlyMaxPrice = priceCap
                broadcastSharedSettings()
              })
              productOptions.appendChild(option)
            }
            PRODUCT_ID = 15
            selectedGrizzlyMaxPrice = 0.015
            await loadProviderBalance()
            return
          }

          elements.countryField.style.display = ''
          if (!availableCountries.length) {
            availableCountries = asArray(await client.getCountries())
              .filter(country => Number(country.id ?? country.country_id) > 0)
              .sort((a, b) => textOf(a, ['name', 'country_name', 'title'])
                .localeCompare(textOf(b, ['name', 'country_name', 'title'])))
          }

          if (!availableCountries.length) {
            throw new Error('SMSCode không trả về danh sách quốc gia.')
          }

          const previousId = selectedCountry ? countryIdOf(selectedCountry) : null

          selectedCountry = availableCountries.find(country =>
            countryIdOf(country) === previousId
          ) || availableCountries.find(country => {
            const iso = countryIsoOf(country)
            const name = countryNameOf(country).toLowerCase()
            return ['US', 'USA'].includes(iso) || name.includes('united states') || name === 'usa'
          }) || availableCountries[0]

          selectedCallingCode = callingCodeOf(selectedCountry)
          renderCountryChips()

          await loadTikTokProductsForSelectedCountry()
          await loadProviderBalance()
        } catch (error) {
          showMessage(`Không tải được danh mục: ${error.message || error}`)
          showToast(error.message || String(error))
        } finally {
          loadingProducts = false
          updateBuyButton()
        }
      }

      async function loadTikTokProductsForSelectedCountry() {
        PRODUCT_ID = null
        productOptions.innerHTML = ''

        if (!selectedCountry) {
          const message = document.createElement('div')
          message.className = 'product-option'
          message.textContent = 'Hãy chọn quốc gia.'
          productOptions.appendChild(message)
          return
        }

        const countryId = Number(selectedCountry.id ?? selectedCountry.country_id)
        const countryName = textOf(selectedCountry, ['name', 'country_name', 'title']) || 'Quốc gia'
        selectedCallingCode = callingCodeOf(selectedCountry)

        if (!Number.isFinite(countryId) || countryId <= 0) {
          throw new Error('ID quốc gia SMSCode không hợp lệ.')
        }

        const services = asArray(await client.getServices(countryId))
        const tiktokServices = services.filter(item => {
          const name = textOf(item, ['name', 'service_name', 'title', 'platform_name']).toLowerCase()
          const slug = textOf(item, ['slug', 'code', 'platform', 'service']).toLowerCase()
          return name.includes('tiktok') || slug.includes('tiktok')
        })

        if (!tiktokServices.length) {
          const message = document.createElement('div')
          message.className = 'product-option'
          message.textContent = `SMSCode không có dịch vụ TikTok tại ${countryName}.`
          productOptions.appendChild(message)
          return
        }

        let productCount = 0
        for (const service of tiktokServices) {
          const serviceId = Number(service.id ?? service.platform_id ?? service.service_id)
          if (!Number.isFinite(serviceId) || serviceId <= 0) continue

          const products = asArray(await client.getProducts(countryId, serviceId))
          products.forEach(product => {
            const id = Number(product.id ?? product.product_id)
            if (!Number.isFinite(id) || id <= 0) return

            const option = document.createElement('div')
            option.className = 'product-option'
            option.dataset.productId = String(id)

            const name = document.createElement('div')
            name.className = 'product-name'
            name.textContent = product.name || product.product_name ||
              textOf(service, ['name', 'service_name', 'title']) || 'TikTok'

            const info = document.createElement('div')
            info.className = 'product-info'
            const stockRaw = product.available ?? product.available_count ??
              product.stock ?? product.quantity_available ?? product.avail
            const stock = Number(stockRaw)
            const stockText = stockRaw != null && Number.isFinite(stock)
              ? stock.toLocaleString('en-US')
              : 'không rõ'
            info.textContent = `${countryName}${selectedCallingCode ? ` (+${selectedCallingCode})` : ''} · Còn ${stockText} số `

            const price = document.createElement('span')
            price.className = 'product-price'
            price.textContent = formatProductPrice(product)
            info.appendChild(price)
            option.append(name, info)
            option.addEventListener('click', () => chooseProduct(option))
            productOptions.appendChild(option)
            productCount++
          })
        }

        if (!productCount) {
          const message = document.createElement('div')
          message.className = 'product-option'
          message.textContent = `Không có sản phẩm TikTok khả dụng tại ${countryName}.`
          productOptions.appendChild(message)
          return
        }

        chooseProduct(productOptions.querySelector('.product-option[data-product-id]'), false)
      }

      async function loadProviderBalance() {
        if (activeProvider === 'grizzly') {
          try {
            const result = await fetch('/api/grizzly/balance').then(r => r.json())
            if (!result.success) throw new Error(result.error?.message || 'Không lấy được số dư')
            const value = result.data?.balance ?? result.data?.amount ?? result.data
            elements.providerBalance.textContent = typeof value === 'object' ? JSON.stringify(value) : String(value ?? '—')
          } catch (error) {
            elements.providerBalance.textContent = 'Không tải được'
          }
        } else {
          elements.providerBalance.textContent = 'SMSCode'
        }
      }

      function getDeviceId() {

        let id = localStorage.getItem('deviceId')

        if (!id) {

          id = crypto.randomUUID ? crypto.randomUUID() : ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16))

          localStorage.setItem('deviceId', id)

        }

        return id

      }

      function updateRoomStatus() {

        document.getElementById('roomStatus').textContent = `Thiết bị đang kết nối: ${socket.connected ? onlineCount : 0}`

        updateBuyButton()

      }

      socket.on('connect', () => {
        socket.emit('join-room', { roomId: ROOM_ID, deviceId })
        updateRoomStatus()
      })

      socket.on('room-settings', async payload => {
        if (!payload || !payload.settings || payload.senderDeviceId === deviceId) return
        await applySharedSettings(payload.settings, payload.revision || 0)
      })

      socket.on('disconnect', () => {

        onlineCount = 0

        updateRoomStatus()

      })

      socket.on('room-devices', devices => {

        onlineCount = devices.length

        updateRoomStatus()

      })

      socket.on('room-command', command => {

        if (command.roomId !== ROOM_ID || processedCommands.has(command.commandId)) return

        processedCommands.add(command.commandId)

        if (processedCommands.size > 500) processedCommands.delete(processedCommands.values().next().value)

        if (command.type === 'CLEAR_ALL') clearAllRows()
        if (command.type === 'BUY_ALL') queueNumberPurchase()

      })

      function sendRoomCommand(type) {

        if (!socket.connected) return showToast('Socket mất kết nối. Vui lòng đợi kết nối lại.')

        socket.emit('room-command', { roomId: ROOM_ID, commandId: crypto.randomUUID ? crypto.randomUUID() : makeIdempotencyKey(), type, senderDeviceId: deviceId })

      }

      function sharedSettingsSnapshot() {
        return {
          provider: activeProvider,
          countryId: selectedCountry ? countryIdOf(selectedCountry) : null,
          countryName: selectedCountry ? countryNameOf(selectedCountry) : null,
          callingCode: selectedCallingCode || '',
          productId: Number.isFinite(PRODUCT_ID) ? PRODUCT_ID : null,
          maxPrice: selectedGrizzlyMaxPrice,
          interval: Math.max(1, Math.min(60, Number(elements.interval.value) || 5)),
        }
      }

      function broadcastSharedSettings() {
        if (applyingRemoteSettings || !socket.connected) return
        socket.emit('room-settings', {
          roomId: ROOM_ID,
          senderDeviceId: deviceId,
          settings: sharedSettingsSnapshot(),
        })
      }

      async function applySharedSettings(settings, revision) {
        if (!settings || applyingRemoteSettings) return
        if (revision && revision <= currentSharedRevision) return
        applyingRemoteSettings = true

        try {
          const nextProvider = settings.provider === 'grizzly' ? 'grizzly' : 'smscode'
          const providerChanged = activeProvider !== nextProvider
          const nextCountryId = Number(settings.countryId || 0)
          const countryChanged = nextProvider === 'smscode' &&
            nextCountryId > 0 &&
            (!selectedCountry || countryIdOf(selectedCountry) !== nextCountryId)

          if (settings.interval) {
            elements.interval.value = String(settings.interval)
          }

          // Chỉ tải danh mục khi đổi nhà cung cấp.
          if (providerChanged) {
            activeProvider = nextProvider
            elements.providerSelect.value = activeProvider
            elements.countryField.style.display = activeProvider === 'smscode' ? '' : 'none'
            await loadProviderProducts()
          }

          // Chỉ tải sản phẩm lại khi quốc gia thực sự thay đổi.
          if (!providerChanged && countryChanged && !loadingProducts) {
            const targetCountry = availableCountries.find(country =>
              countryIdOf(country) === nextCountryId
            )

            if (targetCountry) {
              selectedCountry = targetCountry
              selectedCallingCode = callingCodeOf(targetCountry)
              renderCountryChips()
              await loadTikTokProductsForSelectedCountry()
            }
          }

          if (activeProvider === 'smscode' && settings.productId != null) {
            const targetProduct = productOptions.querySelector(
              `.product-option[data-product-id="${Number(settings.productId)}"]`
            )
            if (targetProduct) chooseProduct(targetProduct, false)
          }

          if (activeProvider === 'grizzly') {
            selectedCallingCode = '1'
            if ([0.015, 0.025].includes(Number(settings.maxPrice))) {
              selectedGrizzlyMaxPrice = Number(settings.maxPrice)
              PRODUCT_ID = selectedGrizzlyMaxPrice === 0.015 ? 15 : 25
              productOptions.querySelectorAll('.product-option').forEach(option => {
                option.classList.toggle('selected', Number(option.dataset.maxPrice) === selectedGrizzlyMaxPrice)
              })
            }
          }

          if (revision) currentSharedRevision = revision
          updateBuyButton()
        } catch (error) {
          showToast(`Không đồng bộ được cấu hình: ${error.message || error}`)
        } finally {
          applyingRemoteSettings = false
        }
      }

      const polling = PollingRegistry.createPollingRegistry()



      elements.localBuyButton.addEventListener('click', queueNumberPurchase)

      

      updateRoomStatus()



      function normalizePhone(phoneNumber, callingCode = selectedCallingCode) {
        let phone = String(phoneNumber || '').trim().replace(/[\\s().-]/g, '')
        if (!phone) return ''
        const code = String(callingCode || '').replace(/^\\+/, '').replace(/\\D/g, '')
        if (code && phone.startsWith('+' + code)) return phone.slice(code.length + 1)
        if (code && phone.startsWith(code)) return phone.slice(code.length)
        return phone.replace(/^\\+/, '')
      }

      async function copyPhoneWithoutFirstTwo(phoneNumber, callingCode = selectedCallingCode) {
        const valueToCopy = normalizePhone(phoneNumber, callingCode)
        if (!valueToCopy) return false
        let copied = false
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(valueToCopy)
            copied = true
          }
        } catch (error) {}
        if (!copied) {
          try {
            const textarea = document.createElement('textarea')
            textarea.value = valueToCopy
            textarea.setAttribute('readonly', '')
            textarea.style.position = 'fixed'
            textarea.style.top = '0'
            textarea.style.left = '0'
            textarea.style.width = '1px'
            textarea.style.height = '1px'
            textarea.style.opacity = '0.01'
            textarea.style.fontSize = '16px'
            document.body.appendChild(textarea)
            textarea.focus({ preventScroll: true })
            textarea.select()
            textarea.setSelectionRange(0, valueToCopy.length)
            copied = document.execCommand('copy')
            textarea.remove()
          } catch (error) {}
        }
        if (copied) showToast(`Đã copy: ${valueToCopy}`)
        else showToast(`Không tự copy được. Chạm số ${valueToCopy} để copy.`)
        return copied
      }

      function queueNumberPurchase() {

        purchaseQueue = purchaseQueue.then(createNumbers, createNumbers)

      }



      async function createNumbers() {
        buying = true
        const provider = activeProvider
        const productId = PRODUCT_ID
        if (provider === 'smscode' && (!Number.isFinite(productId) || productId <= 0)) {
          buying = false
          setBusy(elements.localBuyButton, false)
          showToast('Chưa có sản phẩm SMSCode hợp lệ.')
          return
        }
        const quantity = 1
        const callingCode = provider === 'grizzly' ? '1' : selectedCallingCode
        setBusy(elements.localBuyButton, true, 'Đang tạo...')
        try {
          let result
          if (provider === 'grizzly') {
            const response = await fetch('/api/grizzly/orders/create', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ maxPrice: selectedGrizzlyMaxPrice })
            })
            const payload = await response.json()
            if (!response.ok || !payload.success) throw new Error(payload.error?.message || 'Không thuê được số GrizzlySMS.')
            result = payload.data
          } else {
            result = await client.createOrder({
              productId,
              quantity,
              idempotencyKey: makeIdempotencyKey(),
            })
          }

          for (const order of result.orders || []) {
            orderProviders.set(String(order.id), { provider, callingCode })
            addRow({ ...order, _provider: provider, _callingCode: callingCode })
            startOtpPolling(order.id, Number(elements.interval.value) || 5)
            const copied = await copyPhoneWithoutFirstTwo(order.phone_number, callingCode)
            if (!copied) {
              const row = document.getElementById(`row-${order.id}`)
              const phoneCopy = row?.querySelector('.copy')
              if (phoneCopy) {
                phoneCopy.classList.add('copy-fallback')
                phoneCopy.title = 'Chạm để copy số điện thoại'
                phoneCopy.dataset.copyValue = normalizePhone(order.phone_number, callingCode)
              }
            }
          }
          const created = (result.orders || []).length
          const failed = Number(result.failed_count) || 0
          showToast(`Đã tạo ${created} đơn${failed ? `, ${failed} đơn thất bại` : ''}.`)
        } catch (error) {
          showError(error)
        } finally {
          buying = false
          setBusy(elements.localBuyButton, false, 'Lấy số riêng thiết bị này')
          updateBuyButton()
        }
      }

      function startOtpPolling(orderId, intervalSeconds) {

        const schedule = () => polling.set(orderId, setTimeout(poll, intervalSeconds * 1000))

        async function poll() {

          try {

            const providerInfo = orderProviders.get(String(orderId)) || { provider: 'smscode' }
            let order
            if (providerInfo.provider === 'grizzly') {
              const response = await fetch(`/api/grizzly/orders/${encodeURIComponent(orderId)}`)
              const payload = await response.json()
              if (!response.ok || !payload.success) throw new Error(payload.error?.message || 'Lỗi kiểm tra OTP GrizzlySMS')
              order = payload.data
            } else {
              order = await client.getOrder(orderId)
            }

            if (!document.getElementById(`row-${orderId}`)) return polling.stop(orderId)

            updateOrderRow(order)

            if (order.status === 'OTP_RECEIVED' || order.otp_code) return polling.stop(orderId)

            if (['COMPLETED', 'CANCELED', 'EXPIRED'].includes(order.status)) return polling.stop(orderId)

          } catch (error) {

            if (!document.getElementById(`row-${orderId}`)) return polling.stop(orderId)

            setOrderStatus(orderId, `Lỗi: ${error.message}`, 'failed')

            return polling.stop(orderId)

          }

          schedule()

        }

        schedule()

      }



      function addRow(order) {

        const row = document.createElement('tr')

        row.id = `row-${order.id}`
        const provider = order._provider || activeProvider
        const callingCode = order._callingCode || (provider === 'grizzly' ? '1' : selectedCallingCode)
        orderProviders.set(String(order.id), { provider, callingCode })

        row.append(

          cell(String(order.id)),

          copyCell(order.phone_number ? normalizePhone(order.phone_number, callingCode) : '-', normalizePhone(order.phone_number, callingCode)),

          identifiedCell(`otp-${order.id}`, order.otp_code || '-'),

          statusCell(order.id, statusText(order.status), order.otp_code ? 'success' : 'waiting'),

          identifiedCell(`time-${order.id}`, OrderTime.formatPurchaseTime(order)),

          actionCell(order.id),

        )

        elements.list.prepend(row)

        updateCopyOtpButton()

      }



      function actionCell(orderId) {

        const td = document.createElement('td')

        const button = document.createElement('button')

        button.type = 'button'

        button.className = 'row-delete'

        button.textContent = 'Xóa'

        button.addEventListener('click', () => removeOrderRow(orderId))

        td.append(button)

        return td

      }



      function removeOrderRow(orderId) {

        polling.stop(orderId)

        document.getElementById(`row-${orderId}`)?.remove()

        updateCopyOtpButton()

      }



      function clearAllRows() {

        polling.stopAll()

        elements.list.replaceChildren()

        updateCopyOtpButton()

      }



      function updateCopyOtpButton() {


      }



      function updateOrderRow(order) {

        const otpElement = document.getElementById(`otp-${order.id}`)

        if (order.otp_code && otpElement) {

          otpElement.replaceChildren(copySpan(order.otp_code))

          setOrderStatus(order.id, 'Đã nhận OTP', 'success')

        } else {

          const terminal = ['COMPLETED', 'CANCELED', 'EXPIRED'].includes(order.status)

          setOrderStatus(order.id, statusText(order.status), terminal ? 'failed' : 'waiting')

        }

      }



      function statusText(status) {

        const labels = {

          ACTIVE: 'Đang chờ OTP',

          OTP_RECEIVED: 'Đã nhận OTP',

          COMPLETED: 'Hoàn tất',

          CANCELED: 'Đã hủy',

          EXPIRED: 'Hết hạn',

        }

        return labels[status] || status || 'Đang chờ OTP'

      }



      function cell(text) {

        const td = document.createElement('td')

        td.textContent = text

        return td

      }



      function identifiedCell(id, text) {

        const td = cell(text)

        td.id = id

        return td

      }



      function copySpan(text) {

        const span = document.createElement('span')

        span.className = 'copy'

        span.textContent = text

        span.addEventListener('click', () => copyText(text))

        return span

      }



      function copyCell(text) {

        const td = document.createElement('td')

        td.append(copySpan(text))

        return td

      }



      function statusCell(orderId, text, className) {

        const td = document.createElement('td')

        const span = document.createElement('span')

        span.id = `status-${orderId}`

        span.className = `status ${className}`

        span.textContent = text

        td.append(span)

        return td

      }



      function setOrderStatus(orderId, text, className) {

        const status = document.getElementById(`status-${orderId}`)

        if (!status) return

        status.textContent = text

        status.className = `status ${className}`

      }



      function makeIdempotencyKey() {

        if (crypto.randomUUID) return `order-${crypto.randomUUID()}`

        return `order-${Date.now()}-${Math.random().toString(36).slice(2)}`

      }



      function setBusy(button, busy, label) {

        button.disabled = busy

        button.textContent = label

      }



      function updateBuyButton() {


        elements.localBuyButton.disabled = buying

      }



      async function copyText(text) {

        try {

          await navigator.clipboard.writeText(text)

        } catch {

          const textarea = document.createElement('textarea')

          textarea.value = text

          document.body.appendChild(textarea)

          textarea.select()

          document.execCommand('copy')

          textarea.remove()

        }

        showToast(`Đã copy: ${text}`)

      }



      function showError(error) {

        showToast(error?.message || 'Đã xảy ra lỗi.')

      }



      let toastTimer

      function showToast(message) {

        clearTimeout(toastTimer)

        elements.toast.textContent = message

        elements.toast.classList.add('show')

        toastTimer = setTimeout(() => elements.toast.classList.remove('show'), 3500)

      }

    </script>

  </body>

</html>
